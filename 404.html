<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>404 – Page Not Found | Stackly</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --gold:#F0A500;--gold-light:#FFD166;--gold-dark:#C67F00;
    --ink:#0A0E1A;--ink-mid:#131929;--ink-light:#1E2D45;
    --slate:#2A3F5F;--smoke:#8BA3C7;--mist:#C4D4E8;
    --white:#FFFFFF;--red:#FF5C5C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html{
    width:100%;height:100%;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,0.2) var(--ink-mid);
  }
  html::-webkit-scrollbar{width:6px;}
  html::-webkit-scrollbar-track{background:var(--ink-mid);}
  html::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.25);border-radius:3px;}
  html::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.4);}

  body{
    width:100%;min-height:100%;
    font-family:'Outfit',sans-serif;
    background:var(--ink);color:var(--white);
    overflow-y:scroll;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }

  .bg-img{
    position:fixed;inset:0;z-index:0;
    background:url('./assets/error.webp') center/cover no-repeat;
    opacity:0.4;
    pointer-events:none;
  }
  @media(max-width:480px){
    .bg-img{
      background-size:cover;
      background-position:center top;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }
  }
  .bg-overlay{
    position:fixed;inset:0;z-index:1;
    background:
      radial-gradient(ellipse 70% 50% at 30% 20%,rgba(240,165,0,0.12) 0%,transparent 60%),
      radial-gradient(ellipse 60% 50% at 70% 80%,rgba(42,63,95,0.25) 0%,transparent 60%),
      linear-gradient(180deg,rgba(10,14,26,0.4) 0%,rgba(10,14,26,0.5) 50%,rgba(10,14,26,0.4) 100%);
    pointer-events:none;
  }
  .bg-grid{
    position:fixed;inset:0;z-index:2;opacity:.05;
    background-image:linear-gradient(rgba(240,165,0,0.3) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(240,165,0,0.3) 1px,transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
  }

  .blob{position:fixed;border-radius:50%;filter:blur(100px);z-index:2;animation:drift 8s ease-in-out infinite alternate;pointer-events:none;}
  .blob1{width:400px;height:400px;background:rgba(240,165,0,0.06);top:-150px;right:-100px;}
  .blob2{width:300px;height:300px;background:rgba(42,63,95,0.25);bottom:-80px;left:-80px;animation-delay:3s;}
  .blob3{width:200px;height:200px;background:rgba(240,165,0,0.04);top:40%;left:60%;animation-delay:5s;animation-duration:12s;}
  @keyframes drift{from{transform:translateY(0) scale(1)}to{transform:translateY(30px) scale(1.05)}}

  .particle{position:fixed;border-radius:50%;z-index:3;animation:particleFloat linear infinite;pointer-events:none;}
  .p1{width:3px;height:3px;background:var(--gold);top:15%;left:12%;opacity:.4;animation-duration:16s;}
  .p2{width:2px;height:2px;background:var(--gold-light);top:55%;left:8%;opacity:.3;animation-duration:20s;animation-delay:-6s;}
  .p3{width:3px;height:3px;background:var(--gold);top:35%;left:85%;opacity:.35;animation-duration:14s;animation-delay:-4s;}
  .p4{width:2px;height:2px;background:var(--gold-light);top:75%;left:45%;opacity:.3;animation-duration:18s;animation-delay:-8s;}
  .p5{width:3px;height:3px;background:var(--gold);top:25%;left:55%;opacity:.25;animation-duration:22s;animation-delay:-10s;}
  @keyframes particleFloat{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-120vh) rotate(360deg)}}

  .shooting-star{
    position:fixed;top:20%;left:-10%;z-index:2;
    width:100px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:shoot 4s ease-in-out infinite;opacity:.6;
    pointer-events:none;
  }
  @keyframes shoot{
    0%{transform:translateX(0) translateY(0);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateX(120vw) translateY(50px);opacity:0;}
  }

  .page-wrap{
    position:relative;z-index:4;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:12px 24px 40px;
  }

  .content{
    max-width:520px;
    width:100%;
    text-align:center;
    margin-top:0;
  }

  .logo-wrap{
    margin-bottom:4px;
    animation:fadeDown .7s ease both;
  }
  .logo-wrap a{display:inline-block;transition:transform .3s;}
  .logo-wrap a:hover{transform:scale(1.05);}
  .logo-wrap a:active{transform:scale(0.98);}
  .logo-wrap img{height:28px;opacity:.95;}

  .four-o-four{
    font-family:'Playfair Display',serif;
    font-size:clamp(4rem,15vw,8rem);
    font-weight:900;line-height:1;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-top:2px;
    margin-bottom:8px;
    animation:fadeUp .7s .1s ease both, glowPulse 3s ease-in-out infinite alternate;
    letter-spacing:-3px;
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 15px rgba(240,165,0,0.25));}
    50%{filter:drop-shadow(0 0 40px rgba(240,165,0,0.55));}
  }

  .err-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 14px;border-radius:999px;
    background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);
    font-size:10px;font-weight:700;color:var(--red);letter-spacing:.06em;
    text-transform:uppercase;
    margin-top:0px;
    margin-bottom:20px;
    animation:fadeUp .7s .15s ease both;
  }
  .err-badge::before{
    content:'';width:5px;height:5px;border-radius:50%;background:var(--red);
    animation:pulseDot 2s infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

  .illustration-area{
    margin:0 auto 18px;
    width:150px;height:150px;
    position:relative;
    animation:fadeUp .7s .2s ease both;
  }
  .illustration-area img{
    width:100%;height:100%;
    object-fit:contain;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.5));
    animation:floatImg 5s ease-in-out infinite alternate;
  }
  @keyframes floatImg{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-12px) rotate(1deg)}}

  .deco-ring{
    position:absolute;inset:-12px;border-radius:50%;
    border:1.5px dashed rgba(240,165,0,.15);
    animation:spin 20s linear infinite;
  }
  .deco-ring2{
    position:absolute;inset:-24px;border-radius:50%;
    border:1px dashed rgba(240,165,0,.08);
    animation:spin 30s linear infinite reverse;
  }
  .deco-dot{
    position:absolute;width:6px;height:6px;
    background:var(--gold);border-radius:50%;
    top:-3px;left:50%;margin-left:-3px;
    box-shadow:0 0 8px var(--gold);
  }

  h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(0.95rem,2.8vw,1.15rem);
    font-weight:800;
    margin-bottom:6px;
    animation:fadeUp .7s .25s ease both;
  }
  .desc{
    color:var(--smoke);
    font-size:clamp(11px,2.2vw,12px);
    line-height:1.5;
    margin-bottom:20px;
    animation:fadeUp .7s .3s ease both;
  }

  .actions{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    animation:fadeUp .7s .35s ease both;
  }
  .btn{
    padding:10px 22px;border-radius:10px;font-weight:700;
    font-family:'Outfit',sans-serif;font-size:13px;text-decoration:none;
    transition:all .25s ease;cursor:pointer;border:none;position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:6px;
    -webkit-appearance:none;appearance:none;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:var(--ink);
  }
  .btn-primary::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,transparent,rgba(255,255,255,0.2),transparent);
    transform:translateX(-100%);transition:transform .5s;
  }
  .btn-primary:hover::after{transform:translateX(100%);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(240,165,0,.4);}
  .btn-primary:active{transform:translateY(0);box-shadow:0 4px 12px rgba(240,165,0,.3);}

  .btn-secondary{
    background:rgba(255,255,255,.06);color:var(--mist);
    border:1.5px solid rgba(255,255,255,0.15);
  }
  .btn-secondary:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px);background:rgba(240,165,0,0.05);}
  .btn-secondary:active{transform:translateY(0);}

  .footer-hint{
    margin-top:24px;
    font-size:10px;color:rgba(139,163,199,.3);
    animation:fadeUp .7s .45s ease both;
  }

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  
  @media(max-width:480px){
    .page-wrap{padding:10px 20px 30px;}
    .logo-wrap{margin-bottom:2px;}
    .logo-wrap img{height:26px;}
    .four-o-four{
      font-size:clamp(3.2rem,13vw,6.5rem);
      letter-spacing:-2px;
      margin-top:4px;
      margin-bottom:8px;
      line-height:0.95;
    }
    .err-badge{
      font-size:9px;
      padding:4px 12px;
      margin-top:0px;
      margin-bottom:16px;
    }
    .illustration-area{
      width:130px;
      height:130px;
      margin-bottom:16px;
    }
    .deco-ring{inset:-10px;}
    .deco-ring2{inset:-20px;}
    h2{margin-bottom:5px;font-size:0.95rem;}
    .desc{margin-bottom:18px;font-size:11px;}
    .actions{flex-direction:column;align-items:stretch;gap:8px;}
    .btn{width:100%;justify-content:center;padding:12px 18px;font-size:13px;}
    .footer-hint{margin-top:18px;font-size:9px;}
  }

  @media(max-width:360px){
    .illustration-area{width:110px;height:110px;}
    .four-o-four{font-size:3rem;margin-top:6px;margin-bottom:6px;}
    .err-badge{margin-bottom:14px;}
    .logo-wrap{margin-bottom:2px;}
    .page-wrap{padding:8px 16px 24px;}
  }
</style>
<base target="_blank">
</head>
<body>
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>
  <div class="bg-grid"></div>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="shooting-star"></div>

  <div class="page-wrap">
    <div class="content">
      <div class="logo-wrap">
        <a href="index.html"><img src="./assets/logo.webp" alt="Stackly"/></a>
      </div>

      <div class="four-o-four">404</div>

      <div class="err-badge">Page Not Found</div>

      <div class="illustration-area">
        <div class="deco-ring"><div class="deco-dot"></div></div>
        <div class="deco-ring2"></div>
        <img src="https://cdn-icons-png.flaticon.com/512/4129/4129528.png" alt="Page not found"/>
      </div>

      <h2>Oops! This page is lost in space</h2>
      <p class="desc">The page you're looking for doesn't exist or hasn't been built yet. Don't worry, let's get you back on track.</p>

      <div class="actions">
        <a class="btn btn-primary" href="index.html">Back to Home</a>
        <button class="btn btn-secondary" onclick="history.length > 1 ? history.back() : window.location.href='index.html'">Go Back</button>
      </div>

      <div class="footer-hint">Error Code: 404 | Stackly Digital Marketing</div>
    </div>
  </div>
</body>
</html>
