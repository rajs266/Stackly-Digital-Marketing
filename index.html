<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Stackly – Digital Marketing Platform</title>
<meta http-equiv="refresh" content="0;url=login.html"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root{--gold:#F0A500;--ink:#0A0E1A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Outfit',sans-serif;
    background:var(--ink);color:#fff;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .wrap{text-align:center;}
  .spinner{
    width:36px;height:36px;border-radius:50%;
    border:3px solid rgba(240,165,0,0.2);
    border-top-color:var(--gold);
    animation:spin .8s linear infinite;
    margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:14px;color:rgba(255,255,255,0.4);}
  a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <p>Redirecting… <a href="login.html">Click here</a> if not redirected.</p>
</div>
<script>window.location.replace('login.html');</script>
</body>
</html>
